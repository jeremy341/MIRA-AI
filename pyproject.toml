[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-ai"
dynamic = ["version"]
description = "Machine Intelligence for Recycling Automation - Jugend Forscht 2027"
authors = [{name = "Jeremy Darko", email = "jeremy@example.com"}]
license = {text = "MIT"}
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["recycling", "edge-ai", "yolo", "computer-vision", "waste-sorting"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python-headless>=4.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "psutil>=5.0",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "pydantic>=2.0",
    "uvicorn>=0.20",
    "websockets>=10.0",
    "python-multipart>=0.0.5",
    "pillow>=9.0",
]

[project.optional-dependencies]
train = [
    "tensorflow>=2.10",
]
analysis = [
    "matplotlib>=3.5",
    "pandas>=1.5",
    "scikit-learn>=1.0",
    "scipy>=1.0",
]
all = ["mira-ai[train,analysis]"]
dev = ["pytest==8.3.5", "pytest-asyncio==0.24.0", "pytest-mock==3.14.0", "ruff==0.12.1", "mypy==1.15.0", "mira-ai[all]"]

[project.urls]
Repository = "https://github.com/jeremy341/MIRA-AI"

[project.scripts]
mira = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src", "src.*"]
exclude = ["tests*", "scripts*", "src.dashboard.frontend*"]

[tool.setuptools.package-data]
"src" = ["assets/*.yaml", "assets/models/detection/*.pt", "assets/models/detection/*.yaml"]
"src.dashboard" = ["frontend/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
pythonpath = ["src", "src/dashboard/backend"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["reference/", ".venv/", "datasets/", "models/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501", "E402", "I001", "UP017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
exclude = "src/dashboard"

