[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-ai"
dynamic = ["version"]
description = "Machine Intelligence for Recycling Automation — Jugend Forscht 2027"
authors = [{name = "Jeremy Darko"}]
license = {text = "MIT"}
readme = "README.md"
keywords = ["recycling", "edge-ai", "yolo", "computer-vision", "waste-sorting"]
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "psutil>=5.0",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "pydantic>=2.0",
    "uvicorn>=0.20",
    "websockets>=10.0",
    "python-multipart>=0.0.5",
    "pillow>=9.0",
]

[project.optional-dependencies]
train = [
    "tensorflow>=2.10",
]
analysis = [
    "matplotlib>=3.5",
    "pandas>=1.5",
    "scikit-learn>=1.0",
    "scipy>=1.0",
]
publish = [
    "huggingface_hub>=0.24",
]
all = ["mira-ai[train,analysis,publish]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-mock>=3.14", "ruff>=0.9.0", "mira-ai[all]"]

[project.urls]
Repository = "https://github.com/jeremy341/MIRA-AI"

[project.scripts]
mira = "src.cli:main"

[tool.setuptools.dynamic]
version = {attr = "src.version.__version__"}

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.dashboard" = ["frontend/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["reference/", ".venv/", "datasets/", "models/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501", "E402", "I001", "UP017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
