[project]
name = "mira-ai"
version = "0.1.0"
description = "Machine Intelligence for Recycling Automation — Jugend Forscht 2027"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["reference/", ".venv/", "datasets/", "models/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
