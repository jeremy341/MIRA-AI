description: "Distilled YOLO26n from best teacher — primary target for RPi Zero 2W deployment"
model: yolo26n.pt
dataset: datasets/merged_mira/dataset.yaml
epochs: 200
batch_size: 32
imgsz: 640
optimizer: MuSGD
lr0: 0.01
lrf: 0.01
cos_lr: true
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8
patience: 30
device: "0"
workers: 8
amp: true
close_mosaic: 10
distill_model: "runs/teachers/*/weights/best.pt"
dis: 6.0
project: runs/students
name: distill_yolo26n
exist_ok: true

augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
