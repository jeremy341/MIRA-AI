name: "Recycle Trash (NAVER Connect Foundation)"
key: recycle_trash
description: "21,818 images, 107k boxes, 10 classes - main source for glass + trash class coverage"
source_format: coco
source_url: "https://github.com/connectfoundation/naverconnect-dataset-trash"
input_path: datasets/raw/recycle_trash
splits:
  train: train
  val: val
class_mapping:
  # General trash -> trash
  0: 4
  # Plastic bag -> plastic
  1: 3
  # Paper -> paper
  2: 2
  # Plastic -> plastic
  3: 3
  # Styrofoam -> plastic
  4: 3
  # Metal -> metal
  5: 1
  # Glass -> glass
  6: 0
  # Paper pack -> paper
  7: 2
  # Clothing -> trash
  8: 4
  # Battery -> trash
  9: 4
  # UNKNOWN -> skip
stats:
  total_images: 21818
  total_boxes: 107935
  classes:
    General_trash: 18117
    Plastic_bag: 23805
    Paper: 29873
    Plastic: 14098
    Styrofoam: 5627
    Metal: 4451
    Glass: 4142
    Paper_pack: 4235
    Clothing: 2091
    Battery: 738
    UNKNOWN: 758

